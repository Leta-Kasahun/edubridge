name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Prisma Migrations
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter api prisma db push

      - name: Trigger API Deploy Webhook
        if: env.DEPLOY_WEBHOOK_API != ''
        env:
          DEPLOY_WEBHOOK_API: ${{ secrets.DEPLOY_WEBHOOK_API }}
        run: |
          echo "Triggering API deploy webhook..."
          curl -f -X POST "$DEPLOY_WEBHOOK_API"

      - name: Trigger Web Deploy Webhook
        if: env.DEPLOY_WEBHOOK_WEB != ''
        env:
          DEPLOY_WEBHOOK_WEB: ${{ secrets.DEPLOY_WEBHOOK_WEB }}
        run: |
          echo "Triggering Web deploy webhook..."
          curl -f -X POST "$DEPLOY_WEBHOOK_WEB"

      - name: Check API Health
        if: env.API_HEALTH_URL != ''
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          echo "Checking API health..."
          curl --fail --retry 3 --retry-delay 5 "$API_HEALTH_URL"
