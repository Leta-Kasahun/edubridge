name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter api prisma migrate deploy

      - env:
          DEPLOY_WEBHOOK_API: ${{ secrets.DEPLOY_WEBHOOK_API }}
        run: curl -f -X POST "$DEPLOY_WEBHOOK_API"

      - env:
          DEPLOY_WEBHOOK_WEB: ${{ secrets.DEPLOY_WEBHOOK_WEB }}
        run: curl -f -X POST "$DEPLOY_WEBHOOK_WEB"

      - env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: curl --fail --retry 3 --retry-delay 5 "$API_HEALTH_URL"
